[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mrna-design"
version = "0.1.0.dev0"
description = "Colab notebook that orchestrates pinned open-source tools for mRNA and DNA construct design"
readme = "README.md"
# The Colab runtime is the tested runtime (SPEC-notebook-shell.md §Stack).
requires-python = ">=3.11"
# The licence decision is recorded in DECISIONS.md D-013; packaging metadata and
# the LICENSE file are written at T69 with the repository, not here.
# Runtime dependencies are added by the task that first imports them; several
# carry licence conditions recorded in mrna_design/tools/manifest.yaml (T11).
# PyYAML: config loading and the T04 fixture test.
# pydantic: the validated RunConfig schema (T05, NS-2.1).
# Biopython: translation fidelity in the design contracts (T07, RD-3.4).
dependencies = [
  "PyYAML==6.0.3",
  "pydantic==2.14.3",
  "biopython==1.88",
]

[project.optional-dependencies]
# Pinned exactly: the quality gate must run the same tools locally and in CI.
dev = [
  "ruff==0.17.5",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mrna_design"]

# --------------------------------------------------------------------------
# Ruff — lint + format, Python 3.11 target
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "*.egg-info",
  # Agent tooling, not part of the mRNADesign deliverable (CAPABILITY-MAP §Notes).
  "agent-skills",
  # The specs are approved prose; their code samples are illustrative, not
  # executable, and must not be reformatted by the formatter gate.
  "*.md",
  # Notebooks carry Colab form syntax (#@param) that must not be reformatted.
  "notebooks/**",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "T20", # flake8-print
]
# T10 adds flake8-print (T20): library code must not print to stdout.
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["mrna_design"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------
# mypy — typed public surfaces; adapters get narrower overrides as they land
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["mrna_design"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

# --------------------------------------------------------------------------
# pytest — default invocation runs neither network nor gpu nor e2e (NS-6.2)
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-m 'not network and not gpu and not e2e' --strict-markers --strict-config"
markers = [
  "network: needs network access to an upstream tool or registry (deselected by default)",
  "gpu: needs a CUDA GPU (deselected by default; CPU-only outcomes are recorded, not skipped silently)",
  "e2e: end-to-end run over the golden fixture (deselected by default)",
]
xfail_strict = true

# --------------------------------------------------------------------------
# Coverage — 80 % overall gate; per-module minimums recorded here at T02 and
# enforced once each module exists (plan CP1, T68).
# --------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["mrna_design"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
]

[tool.mrna_design.coverage-minimums]
overall = 80
shell = 80
contracts = 95
adapters = 95
qc = 85
construct = 85
