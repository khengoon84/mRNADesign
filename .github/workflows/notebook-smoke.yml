name: notebook-smoke

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev] nbconvert jupyter
      - run: jupyter nbconvert --to notebook --execute notebooks/mRNADesign.ipynb --output-dir /tmp/nb --ExecutePreprocessor.timeout=3600
